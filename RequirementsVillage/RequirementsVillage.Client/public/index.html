<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Requirements Village</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
    <style>
        .title-font {
            font-family: 'Cinzel', serif;
        }
        .body-font {
            font-family: 'Crimson Text', serif;
        }
        
        /* Light Theme (Default) */
        html[data-theme="requirements-village"] {
            --background-color: #ffffff;
            --text-color: #363636;
            --header-background: #ffffff;
            --border-color: #e5e5e5;
            --card-background: #ffffff;
            --card-shadow: rgba(10, 10, 10, 0.1);
        }
        
        /* Dark Theme */
        html[data-theme="requirements-village-dark"] {
            --background-color: #1a1a1a;
            --text-color: #f5f5f5;
            --header-background: #2d2d2d;
            --border-color: #404040;
            --card-background: #2d2d2d;
            --card-shadow: rgba(0, 0, 0, 0.3);
        }
        
        /* Apply theme variables */
        html[data-theme="requirements-village-dark"] body {
            background-color: var(--background-color);
            color: var(--text-color);
        }
        
        html[data-theme="requirements-village-dark"] .has-background-white {
            background-color: var(--header-background) !important;
        }
        
        html[data-theme="requirements-village-dark"] .title,
        html[data-theme="requirements-village-dark"] .subtitle {
            color: var(--text-color) !important;
        }
        
        html[data-theme="requirements-village-dark"] .card {
            background-color: var(--card-background) !important;
            color: var(--text-color) !important;
        }
        
        html[data-theme="requirements-village-dark"] .button {
            background-color: var(--card-background) !important;
            color: var(--text-color) !important;
            border-color: var(--border-color) !important;
        }
    </style>
</head>
<body>
    <div id="app"></div>
</body>
</html>
